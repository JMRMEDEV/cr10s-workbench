# CR-10S PLA — LARGE PART, 8-BIT-BOARD-FRIENDLY (low command count)
# Priority: XY accuracy for boss placement + flat/no-warp. Normal speeds (big layers
# cool fine, no min-layer-time crawl). Brim for adhesion on a large thin part.
bed_shape = 0x0,300x0,300x300,0x300
max_print_height = 400
gcode_flavor = marlin
nozzle_diameter = 0.4
filament_diameter = 1.75

# layers
layer_height = 0.2
first_layer_height = 0.28
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 4
extrusion_width = 0.6
first_layer_extrusion_width = 0.46

# temps (PID retuned; stable)
temperature = 200
first_layer_temperature = 205
bed_temperature = 55
first_layer_bed_temperature = 55

# cooling: normal for PLA on large layers (no min-layer-time crawl)
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 2
cooling = 1
slowdown_below_layer_time = 8
min_print_speed = 15

# speeds — normal (accuracy on perimeters, fast infill)
perimeter_speed = 45
external_perimeter_speed = 30
small_perimeter_speed = 25
infill_speed = 70
solid_infill_speed = 55
top_solid_infill_speed = 40
travel_speed = 180
bridge_speed = 30
first_layer_speed = 20

# accuracy / strength (moderate — not fragile, not heavy)
fill_density = 12%
fill_pattern = rectilinear

# adhesion for big thin flat part (anti-warp)
brim_width = 6
skirts = 0

# retraction (bowden)
retract_length = 5
retract_speed = 40
retract_lift = 0.2

start_gcode = M140 S{first_layer_bed_temperature[0]}\nM104 S{first_layer_temperature[0]}\nG28\nM420 S1\nM190 S{first_layer_bed_temperature[0]}\nM104 S{first_layer_temperature[0]}\nG4 S30\nG92 E0\nG1 Z5 F3000\nG1 X5 Y20 F5000\nG1 Z0.28 F500\nG1 X5 Y200 E18 F800\nG92 E0\nG1 Z2 F3000
end_gcode = M104 S0\nM140 S0\nM107\nG91\nG1 Z10 F600\nG90\nG1 X10 Y280 F6000\nM84
gcode_resolution = 0.12
gap_fill_enabled = 0
