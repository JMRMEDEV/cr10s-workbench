# CR-10S PLA — SMALL PARTS v3 (cooling: min_print_speed 5 so 15s/layer target is reached)
# Tuned after the quarter-Benchy test: prioritizes COOLING on tiny layers + lower temp.
# Bed shape declared so the part centers on the real bed center (150,150) = glue spot.

bed_shape = 0x0,300x0,300x300,0x300
max_print_height = 400
gcode_flavor = marlin
nozzle_diameter = 0.4
filament_diameter = 1.75

# --- layers / resolution ---
layer_height = 0.12
first_layer_height = 0.24
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 4
extrusion_width = 0.40
first_layer_extrusion_width = 0.42

# --- temps (lowered to reduce heat buildup) ---
temperature = 200
first_layer_temperature = 205
bed_temperature = 55
first_layer_bed_temperature = 55

# --- COOLING (the #1 fix for small parts) ---
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 2
# slow down so each layer takes >= 15s; never below min_print_speed
slowdown_below_layer_time = 15
min_print_speed = 5
cooling = 1
fan_below_layer_time = 20

# --- speeds (slow outer/small features for detail) ---
perimeter_speed = 40
external_perimeter_speed = 20
small_perimeter_speed = 12
infill_speed = 55
solid_infill_speed = 45
top_solid_infill_speed = 25
travel_speed = 150
bridge_speed = 18
first_layer_speed = 18

# --- retraction (bowden) ---
retract_length = 5
retract_speed = 40
retract_lift = 0.2

# --- adhesion ---
fill_density = 15%
fill_pattern = gyroid
skirts = 2
skirt_distance = 3

# --- start/end (no M109; ZShift handles Z datum) ---
start_gcode = M140 S{first_layer_bed_temperature[0]}\nM104 S{first_layer_temperature[0]}\nG28\nM420 S1\nM190 S{first_layer_bed_temperature[0]}\nM104 S{first_layer_temperature[0]}\nG4 S30\nG92 E0\nG1 Z5 F3000\nG1 X5 Y20 F5000\nG1 Z0.24 F500\nG1 X5 Y120 E10 F600\nG92 E0\nG1 Z2 F3000
end_gcode = M104 S0\nM140 S0\nM107\nG91\nG1 Z10 F600\nG90\nG1 X10 Y280 F6000\nM84
