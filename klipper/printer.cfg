# CR-10S (Creality V2.2 board, ATmega2560 @16MHz) + BLTouch — Klipper printer.cfg (DRAFT)
# Base pin map: Klipper official config/printer-creality-cr10s-2017.cfg (ATmega2560).
# Values marked  # MEASURED  come from this printer's Marlin M503 / PID tune.
# Values marked  # VERIFY    MUST be confirmed on the machine before homing.

[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A10719QE-if00-port0
# baud defaults to 250000 (matches firmware build)

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 1500            # conservative start; tune later (official sample uses 3000)
max_z_velocity: 5
max_z_accel: 100

# ---------------- steppers ----------------
# rotation_distance = full_steps(200) * microsteps(16) / steps_per_mm
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40      # MEASURED: M92 X80
endstop_pin: ^PE5
position_endstop: 0
position_max: 300
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40      # MEASURED: M92 Y80
endstop_pin: ^PJ1
position_endstop: 0
position_max: 300
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: !PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8       # MEASURED: M92 Z400
endstop_pin: probe:z_virtual_endstop   # BLTouch replaces the Z switch (wired on Z-min)
position_min: -3           # allow negative Z during PROBE_CALIBRATE
position_max: 400

# ---------------- BLTouch ----------------
[bltouch]
sensor_pin: ^PD3           # Z-min port (White/Black pair). Official 2560 map: Z endstop = PD3.
control_pin: PC0           # pin-27 adapter taps the LCD beeper line. Marlin pins_RAMPS_CREALITY.h
                           #   (Creality 2560 boards): BEEPER_PIN 37 -> ar37 = PC0. ("pin 27"/PA4 is Melzi only.)
                           #   Still confirm with BLTOUCH_DEBUG COMMAND=pin_down / pin_up BEFORE any homing.
x_offset: 0                # VERIFY: measure probe tip vs nozzle (X). Sign: probe right of nozzle = +
y_offset: 0                # VERIFY: measure probe tip vs nozzle (Y). Sign: probe behind nozzle = +
# z_offset is set by PROBE_CALIBRATE + SAVE_CONFIG (the proper fix for the old Z0-crush problem)
speed: 5
samples: 2
sample_retract_dist: 3
samples_tolerance: 0.05
samples_tolerance_retries: 2

[safe_z_home]
home_xy_position: 150, 150 # nozzle position for Z homing (adjust by -offsets so the PROBE lands mid-bed)
speed: 80
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 30, 30           # VERIFY: must be reachable by the PROBE once x/y offsets are known
mesh_max: 270, 270         # VERIFY: same
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10

# ---------------- hotend ----------------
[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 34.409  # MEASURED: M92 E93 -> 3200/93
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 18.51              # MEASURED: M303 autotune 2026-11-08 (re-run PID_CALIBRATE under Klipper)
pid_Ki: 1.64
pid_Kd: 52.32
min_temp: 0
max_temp: 250
max_extrude_only_distance: 100

[heater_bed]
heater_pin: PH5
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK6
control: pid
pid_Kp: 690.34             # official sample values; run PID_CALIBRATE HEATER=heater_bed TARGET=60
pid_Ki: 111.47
pid_Kd: 1068.83
min_temp: 0
max_temp: 110

[fan]
pin: PH6

[display]
lcd_type: st7920
cs_pin: PH1
sclk_pin: PA1
sid_pin: PH0
encoder_pins: ^PC4, ^PC6
click_pin: ^!PC2

# ---------------- host integration ----------------
[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]
